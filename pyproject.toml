[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-agent"
version = "0.1.0"
description = "SON - A privacy-aware hybrid local/cloud AI assistant"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27,<1"
]

[project.scripts]
son = "local_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]